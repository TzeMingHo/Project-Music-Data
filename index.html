<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Music data reports" />
    <title>Music Data Reports</title>
    <script type="module" src="script.mjs"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <p class="eyebrow">A listening data explorer</p>
      <h1 id="page-header">Music Data <span>Reports</span></h1>
      <p class="introduction">
        Turn listening logs into a snapshot of each listener’s musical
        habits—from favorite artists and genres to late-night listening streaks.
      </p>
    </header>
    <main>
      <section class="report-shell" aria-label="Listener report">
        <div class="selector-panel">
          <label for="user-select">Choose a listener</label>
          <select id="user-select" name="user-select">
            <option id="default-option" value="">Select a user</option>
          </select>
        </div>
        <div id="report-area" aria-live="polite"></div>
      </section>
    </main>
    <footer>
      <span class="footer-dot" aria-hidden="true"></span>
      Made for music lovers
    </footer>
  </body>
</html>
